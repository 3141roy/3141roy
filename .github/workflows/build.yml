name: Update profile card
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {} 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Restore LOC cache
        uses: actions/cache@v6
        with:
          path: cache/loc_*.txt
          key: loc-cache-${{ github.run_id }}
          restore-keys: loc-cache-

      - name: Update card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
          EXCLUDED_OWNERS: ${{ secrets.EXCLUDED_OWNERS }}
        run: python update.py

      - name: Commit changes
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: update profile card"
          git push
